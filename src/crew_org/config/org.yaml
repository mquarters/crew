# Organization policy. The Scrum Master and the board Flow read this file;
# it is the single place process constants are defined.

board:
  # Status column order is authoritative — the Flow derives legal transitions
  # from this sequence. `Blocked` is off-flow and reachable from anywhere.
  columns:
    - Inbox (Goals)
    - Needs Refinement
    - Ready
    - Sprint Backlog
    - In Progress
    - Reviewing
    - QAing
    - Merging
    - Done
  blocked_column: Blocked

  # Columns a human owns. No agent may move a card OUT of these.
  human_gates:
    - Inbox (Goals)

wip_limits:
  Needs Refinement: 8
  Ready: 10
  Sprint Backlog: 10
  In Progress: 3
  Reviewing: 3
  QAing: 3
  Merging: 3

sprint:
  # One day, matching the board's iteration field — the shortest GitHub allows.
  # A crew that runs unattended drains a fortnight's scope long before the
  # fortnight ends, and then the sprint review it was building towards has two
  # weeks of work in it and is too large to be read. Nothing in the code reads
  # this; it is here so the number the board runs on is written down somewhere
  # a person looks.
  length_days: 1
  # Starting capacity in points. The Sponsor approves epics, not sprint
  # contents: scope is filled mechanically from approved epics in priority
  # order until this is reached. Replaced by measured velocity once there is
  # history to measure.
  capacity_points: 20
  # Cards per sprint permitted to escalate. One a day: at fortnightly sprints
  # this was 3 per fortnight, and moving the board to daily iterations would
  # have made the same number roughly fourteen times the spend without anyone
  # choosing to. There is no whole number that preserves the old rate, so this
  # is the deliberate one.
  #
  # It reads as spend because escalation today means headless Claude Code on a
  # subscription. That is what escalation currently *is*, not what it must be —
  # the budget limits how often a card may reach for help, whatever the help
  # turns out to be.
  escalation_budget: 1
  blocked_aging_days: 3         # raise to Sponsor at sprint review beyond this

design:
  # The Architect is the role a 27B model is weakest at, and therefore the one
  # most likely to drain the escalation budget. Small epics skip design
  # entirely: a design note on a two-story epic costs more than it saves.
  #
  # An epic requires design if it exceeds ANY threshold below. Raise these to
  # buy back escalation budget; lower them if developers start inventing
  # conflicting approaches.
  min_points: 13          # total story points in the epic
  min_stories: 4          # number of stories
  min_modules: 3          # distinct modules or packages the epic touches
  force_label: needs:design   # Sponsor or Scrum Master can demand design
  skip_label: no:design       # ...or waive it

estimation:
  scale: [1, 2, 3, 5, 8]
  max_story_points: 8           # larger must be split, never admitted

delivery:
  # Repositories the crew may WORK IN. Cards outside this list still appear on
  # the board, are refined, and are tracked — they are simply never claimed.
  #
  # The crew's own repository is deliberately absent. An orchestrator editing
  # itself mid-run is a sharp edge: a bad change to the delivery loop breaks the
  # thing making the change, and the failure arrives with no working process to
  # diagnose it. That work is tracked on the board and done by hand.
  repos:
    - sprint-metrics

sandbox:
  # Testing the crew's output means executing code an LLM wrote. That happens in
  # a container with no network, no capabilities, a non-root user and hard
  # resource limits.
  #
  # 'required' fails when no engine is available rather than falling back to the
  # host — a silent fallback looks protected while running arbitrary code as the
  # user. 'off' is an explicit acceptance of that risk, never a default.
  mode: required
  engine: docker
  image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim

execution:
  max_iterations_per_card: 12   # hard cap; exceeded -> Blocked
  max_wallclock_seconds: 900    # per card, per tick
  local_repair_attempts: 2      # SCHEMA / VERIFY retries before giving up

escalation:
  # Failure classes that may NEVER escalate. Enforced in code, not by prompt.
  never_escalate: [SCHEMA, SCOPE, REGRESSION]
  may_escalate: [VERIFY, CAPABILITY]
  require_justification: [CAPABILITY]
  concurrency: 1                # protects the subscription rate-limit window
  # Escalation rate above this fraction of sprint cards produces process-defect
  # issues in the retro.
  health_threshold: 0.20

labels:
  routing:
    refine: crew:refine
    dev: crew:dev
    qa: crew:qa
    review: crew:review
  control:
    needs_human: needs:human
    blocked: blocked
  defect:
    prompt: defect:prompt
    process: defect:process
