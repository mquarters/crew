[project]
name = "crew-org"
version = "0.1.0"
description = "An agile engineering organization run as CrewAI agents, orchestrated by a GitHub Projects v2 board."
readme = "README.md"
# CrewAI 1.15.x declares >=3.10,<3.14. Pinned to 3.12 as the well-trodden
# version within that range; the system default 3.14 is excluded outright.
requires-python = ">=3.12,<3.13"

dependencies = [
    "crewai>=1.15.22,<2",
    "pydantic>=2.9,<3",
    "httpx>=0.27",          # Projects v2 GraphQL
    "pyyaml>=6.0",
    "rich>=13.7",           # live TUI
    "typer>=0.12",          # crew CLI
    "pyjwt[crypto]>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
crew = "crew_org.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crew_org"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
